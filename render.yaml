# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploy: Render dashboard -> New -> Blueprint -> select this repo.
services:
  - type: web
    name: swynex-task-api
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: API_KEY
        generateValue: true        # Render creates a random secret; read it in Dashboard -> Environment
      - key: SEED_ON_EMPTY
        value: "true"              # load sample tasks whenever the database starts empty
    # --- Persistent data (paid plans only) -------------------------------
    # The free plan has an ephemeral filesystem: SQLite data resets on every
    # deploy/restart. To keep data, change `plan` to `starter` (or higher),
    # uncomment the disk below, and add the DB_PATH env var.
    #
    # disk:
    #   name: task-data
    #   mountPath: /var/data
    #   sizeGB: 1
    # (envVars) - key: DB_PATH
    #             value: /var/data/tasks.db
